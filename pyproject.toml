[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qis-quantum"
version = "1.0.0"
description = "Secure Quantum Image Steganography: NEQR Superposition Encoding + Unitary Q-LSB Data Concealment on NISQ Simulators"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Akash Narayanan C", email = "itachi2006uchiha2007@gmail.com" }
]
keywords = [
    "quantum-computing",
    "qiskit",
    "steganography",
    "image-processing",
    "neqr",
    "quantum-image-processing",
    "qip",
    "security"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Security :: Cryptography"
]
dependencies = [
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "matplotlib>=3.7.0",
    "scikit-image>=0.21.0",
    "scipy>=1.11.0",
    "PyYAML>=6.0",
    "fpdf2>=2.7.6",
    "opencv-python>=4.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
qis = "qis.cli:main"

[project.urls]
Homepage = "https://github.com/akashnarayanan007/QuantumSteganography"
Repository = "https://github.com/akashnarayanan007/QuantumSteganography.git"
"Bug Tracker" = "https://github.com/akashnarayanan007/QuantumSteganography/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["qis*", "core*", "metrics*", "reporting*"]
exclude = ["tests*", "output*", "sample_images*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.png", "*.md"]

